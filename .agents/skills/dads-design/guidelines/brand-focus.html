<!-- @dsCard group="Brand" viewport="700x170" name="Focus indicator" subtitle="The signature DADS dual ring — yellow band inside a black outline. Never remove it." -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 32px 24px; background: var(--surface-page); display: flex; align-items: center; gap: 40px; }
  .demo { display: flex; gap: 28px; align-items: center; }
  .btn { font: 700 16px/1 var(--font-sans); color:#fff; background: var(--color-blue-900); border: 4px double transparent; border-radius: var(--radius-8); padding: 14px 24px; }
  .focused { outline: 4px solid var(--color-black); outline-offset: 2px; box-shadow: 0 0 0 2px var(--color-focus-yellow); }
  .input { font: 400 16px/1 var(--font-sans); border: 1px solid var(--border-field); border-radius: var(--radius-8); padding: 14px 16px; width: 160px; color: var(--text-body); }
  .cap { font: 400 13px/1.6 var(--font-sans); color: var(--text-subtle); max-width: 200px; }
</style>
</head>
<body>
  <div class="demo">
    <span class="btn focused">フォーカス時</span>
    <input class="input focused" value="入力欄" readonly>
  </div>
  <p class="cap">2px の黄色いリングを 4px の黒いアウトラインで挟む二重指標。コントラスト環境を問わず視認できます。</p>
</body>
</html>
