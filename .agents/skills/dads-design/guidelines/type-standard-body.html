<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); color: var(--text-body); }

  .tag { font: 400 12px/1.5 var(--font-mono); color: var(--text-placeholder); }

<body>
  <div class="row"><span class="tag">std-17N-170</span><p class="text-std-17N-170">デジタル庁デザインシステムは、行政機関のウェブサイトやアプリケーションを、誰もが迷わず使えるようにするための共通基盤です。</p></div>
  <div class="row"><span class="tag">std-16N-170</span><p class="text-std-16N-170">アクセシビリティと一貫性を担保しながら、開発の効率も高めることを目的としています。</p></div>
  <div class="row"><span class="tag">std-16N-175</span><p class="text-std-16N-175">長文のコンテンツには、ゆとりのある行間を用いて読みやすさを確保します。</p></div>
</body>
</html>
