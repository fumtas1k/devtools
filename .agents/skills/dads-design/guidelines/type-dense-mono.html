<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); color: var(--text-body); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border: 0; }
  .tag { font: 400 12px/1 var(--font-mono); color: var(--text-placeholder); width: 120px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="row"><span class="tag">dns-16N-130</span><span class="text-dns-16N-130">テーブルやフォームの密度の高いUIに使用します</span></div>
  <div class="row"><span class="tag">dns-14B-120</span><span class="text-dns-14B-120">注釈・補助テキスト</span></div>
  <div class="row"><span class="tag">oln-16B-100</span><span class="text-oln-16B-100">ボタンラベル</span></div>
  <div class="row"><span class="tag">mono-16N-150</span><span class="text-mono-16N-150">&lt;meta charset="UTF-8"&gt;</span></div>
</body>
</html>
