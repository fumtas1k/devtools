<!-- @dsCard group="Spacing" viewport="700x150" name="Border radius" subtitle="From 4px (chips) through 8px (controls), 12px (cards), to full pills." -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); display: flex; align-items: center; gap: 22px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 64px; height: 64px; background: var(--color-solid-gray-100); border: 1px solid var(--border-divider); }
  .lab { font: 400 12px/1 var(--font-mono); color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-none)"></div><div class="lab">none</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-4)"></div><div class="lab">4</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-8)"></div><div class="lab">8</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-12)"></div><div class="lab">12</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-16)"></div><div class="lab">16</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-32)"></div><div class="lab">32</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-full)"></div><div class="lab">full</div></div>
</body>
</html>
