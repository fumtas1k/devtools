<!-- @dsCard group="Colors" viewport="700x200" name="Neutral / Solid Gray" subtitle="Text, borders and surfaces. 536 is the AA contrast floor on white." -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-page); }
  .scale { display: grid; grid-template-columns: repeat(13, 1fr); gap: 0; border: 1px solid var(--border-subtle); border-radius: var(--radius-8); overflow: hidden; }
  .sw { aspect-ratio: 1 / 1.4; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; }
  .sw span { font: 400 11px/1 var(--font-sans); }
  .legend { margin-top: 10px; font: 400 12px/1.5 var(--font-sans); color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="scale" id="scale"></div>
  <div class="legend">White → 50 · 100 · 200 · 300 · 400 · 420 · 500 · 536 · 600 · 700 · 800 · 900 → Black</div>
  <script>
    const steps = [50,100,200,300,400,420,500,536,600,700,800,900];
    const el = document.getElementById('scale');
    const white = document.createElement('div');
    white.className='sw'; white.style.background='#fff'; white.style.borderRight='1px solid var(--border-subtle)';
    white.innerHTML='<span style="color:#1a1a1a">0</span>'; el.appendChild(white);
    steps.forEach(s => {
      const d = document.createElement('div'); d.className='sw';
      d.style.background = getComputedStyle(document.documentElement).getPropertyValue('--color-solid-gray-'+s);
      d.innerHTML = `<span style="color:${s<=400?'#1a1a1a':'#fff'}">${s}</span>`;
      el.appendChild(d);
    });
  </script>
</body>
</html>
