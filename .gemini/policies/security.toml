# Gemini CLI Security Policy

# --- DENY RULES ---

# Destructive or privileged operations
[[rule]]
toolName = "run_shell_command"
commandPrefixes = [
  "gh repo delete",
  "gh secret delete",
  "gh secret remove",
  "gh secret set",
  "gh ssh-key delete",
  "gh auth logout",
  "npm install -g",
  "npm publish",
  "rm -rf /",
  "rm -rf ~"
]
decision = "deny"
priority = 100
denyMessage = "Destructive or privileged operations are strictly prohibited."

# Force push protection
[[rule]]
toolName = "run_shell_command"
commandRegex = "^git push .*( --force|-f).*"
decision = "deny"
priority = 100
denyMessage = "Force push is strictly prohibited."

# Restricted API operations (including GraphQL mutations and DELETE)
[[rule]]
toolName = "run_shell_command"
commandRegex = "^gh api (graphql\\b|.*\\b(-X|--method)\\s+DELETE\\b).*"
decision = "deny"
priority = 100
denyMessage = "Direct GraphQL mutations or DELETE via API are prohibited to prevent accidental resource deletion."

# Execution of remote content via pipe
[[rule]]
toolName = "run_shell_command"
commandRegex = ".*(curl|wget).*\\|\\s*(sh|bash|zsh|python|node).*"
decision = "deny"
priority = 100
denyMessage = "Piping remote content directly to a shell or interpreter is strictly prohibited."

# Sensitive file access (Local context)
[[rule]]
toolName = "read_file"
filePathRegex = "(^|/)\\.env(\\..*)?$"
decision = "deny"
priority = 100
denyMessage = "Access to environment files is restricted."

[[rule]]
toolName = "read_file"
filePathRegex = "^secrets/.*"
decision = "deny"
priority = 100

# Sensitive file access (Absolute paths to prevent bypass)
[[rule]]
toolName = "read_file"
filePathRegex = "^(/Users/[^/]+|/home/[^/]+)/\\.aws/.*"
decision = "deny"
priority = 100

[[rule]]
toolName = "read_file"
filePathRegex = "^(/Users/[^/]+|/home/[^/]+)/\\.ssh/.*"
decision = "deny"
priority = 100

# --- ALLOW RULES ---

[[rule]]
toolName = "run_shell_command"
commandPrefixes = ["git pull", "git fetch", "gh pr diff"]
decision = "allow"
priority = 50

# --- ASK RULES ---

[[rule]]
toolName = "run_shell_command"
commandPrefixes = [
  "git push",
  "git reset --hard",
  "gh pr create",
  "gh pr merge",
  "gh pr close",
  "gh pr edit",
  "gh release",
  "gh repo archive",
  "gh repo rename",
  "gh issue delete",
  "gh issue close",
  "gh workflow run",
  "gh workflow disable",
  "gh api"
]
decision = "ask_user"
priority = 50

# Metadata protection: Prevent agent from modifying its own configuration via shell commands
[[rule]]
toolName = "run_shell_command"
commandRegex = ".*(sed\\s+-i|tee|cp|mv|[^\\s]*>\\s*).*(\\.(gemini|claude)/).*"
decision = "ask_user"
priority = 50

# Metadata protection: Direct file edits
[[rule]]
toolName = "replace"
filePathRegex = "^\\.(gemini|claude)/(settings\\.json|policies/.*)$"
decision = "ask_user"
priority = 50

[[rule]]
toolName = "write_file"
filePathRegex = "^\\.(gemini|claude)/(settings\\.json|policies/.*)$"
decision = "ask_user"
priority = 50
