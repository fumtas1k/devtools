name: Dependabot security auto-merge

# Dependabot の npm security update PR を、条件を満たすときだけ develop へ即時 auto-merge する
# （docs/decisions.md [132]）。CI（ruleset の required checks）が green になった時点で
# GitHub がマージする。main へのマージは人が行う（security-release-pr.yml が PR を作る）。
#
# 毎回まず auto-merge を解除し、次の条件をすべて満たしたときだけ有効にし直す（fail closed）:
#   - PR の作成者と今回の push の actor がどちらも dependabot[bot]、ブランチが dependabot/npm_and_yarn/
#   - 変更ファイルが package.json / package-lock.json だけ
#   - Dependabot alert が OPEN（GHSA ID が取れる）、semver-major ではない、1 パッケージだけ、Playwright 系ではない
#   - lockfile に新しく入った版が、advisory の修正版（first_patched_version）と完全一致するもの以外
#     すべて公開から 7 日以上（scripts/check-lockfile-release-age.mjs）
#   - develop の ruleset に required checks（test / e2e）がある
# 満たさない PR には理由をコメントして人の判断に回す。
#
# GITHUB_TOKEN でマージすると develop への push で workflow が起動せず、リリース PR も
# 作られないため、GitHub App のトークンを使う。Dependabot が起動した workflow は
# Dependabot secrets しか読めないので、App の Client ID と秘密鍵は Dependabot secrets に登録する。

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dependabot の PR に Dependabot 以外が push したら、以前に有効化した auto-merge を解除する
  revoke-on-foreign-push:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: write
    steps:
      - name: auto-merge を解除
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$enabled" = "true" ]; then
            gh pr merge "$PR_URL" --disable-auto
            echo "Dependabot 以外の push があったため auto-merge を解除した"
          fi

  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    permissions:
      contents: read
      pull-requests: read
    steps:
      # pull_request 起動では workflow 定義も PR 側から読まれる。npm の更新以外のファイル
      # （workflow 自体を含む）を変える PR には、App の秘密鍵を一切渡さない
      - name: 変更ファイルが package.json / package-lock.json だけか確認
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          unexpected=$(gh pr diff "$PR_URL" --name-only | grep -vxE 'package(-lock)?\.json' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::npm の security update 以外のファイルが変更されているため処理しない:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: マージ用の App トークンを発行
        id: write-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SECURITY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # 評価が終わるまで（失敗した場合も）前回の push で有効化した auto-merge を残さない
      - name: 評価の前に auto-merge を解除
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$enabled" = "true" ]; then
            gh pr merge "$PR_URL" --disable-auto
          fi

      # alert の参照だけに絞ったトークン（GITHUB_TOKEN には Dependabot alerts の権限が無い）
      - name: alert 参照用の App トークンを発行
        id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SECURITY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SECURITY_BOT_PRIVATE_KEY }}
          permission-vulnerability-alerts: read
          permission-contents: read
          permission-pull-requests: read

      - name: Dependabot の更新内容を取得
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ steps.read-token.outputs.token }}
          alert-lookup: true

      - name: 自動マージの条件を判定
        id: decide
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          ALERT_STATE: ${{ steps.meta.outputs.alert-state }}
          GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
        shell: bash
        run: |
          set -euo pipefail
          reason=""
          if [ "$ECOSYSTEM" != "npm_and_yarn" ]; then
            reason="npm 以外の更新（$ECOSYSTEM）"
          elif [ "$ALERT_STATE" != "OPEN" ] || [[ ! "$GHSA_ID" =~ ^GHSA(-[23456789cfghjmpqrvwx]{4}){3}$ ]]; then
            reason="OPEN の Dependabot alert に対応する security update ではない（alert-state=${ALERT_STATE:-なし}）"
          elif [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            reason="semver-major の更新"
          elif [[ "$DEPENDENCY_NAMES" == *,* ]]; then
            reason="複数パッケージの更新（$DEPENDENCY_NAMES）"
          elif [[ "$DEPENDENCY_NAMES" =~ ^(@playwright/test|playwright|playwright-core)$ ]]; then
            reason="Playwright の更新（CI の container image も上げる必要がある）"
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            echo "自動マージしない: $reason"
          fi

      # advisory が指定する修正版だけを公開直後でも許可する。推移的依存では Dependabot が
      # npm update で範囲内の最新版を選ぶため、修正版より新しい公開直後の版が入りうる
      - name: advisory の修正版を取得
        id: patched
        if: steps.decide.outputs.reason == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
        shell: bash
        run: |
          set -euo pipefail
          allowed=$(gh api "/advisories/$GHSA_ID" \
            --jq '[.vulnerabilities[] | select(.package.ecosystem == "npm" and .package.name == env.DEPENDENCY_NAMES) | .first_patched_version | select(. != null and . != "") | env.DEPENDENCY_NAMES + "@" + .] | join(",")')
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "公開直後でも許可する版: ${allowed:-なし}"

      # 判定に使うスクリプトは base 側のものを使う（変更ファイルの確認と合わせた多層防御）
      - uses: actions/checkout@v6
        if: steps.decide.outputs.reason == ''
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        if: steps.decide.outputs.reason == ''
        with:
          node-version-file: .node-version

      - name: lockfile に入った公開直後の版を検出
        id: release-age
        if: steps.decide.outputs.reason == ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOWED_VERSIONS: ${{ steps.patched.outputs.allowed }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:package-lock.json" > "$RUNNER_TEMP/base-lock.json"
          git show "$HEAD_SHA:package-lock.json" > "$RUNNER_TEMP/head-lock.json"
          node scripts/check-lockfile-release-age.mjs "$RUNNER_TEMP/base-lock.json" "$RUNNER_TEMP/head-lock.json" --allow "$ALLOWED_VERSIONS" --min-days 7

      - name: 日本語の squash 件名で auto-merge を有効化
        if: steps.decide.outputs.reason == '' && steps.release-age.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          DEPENDENCY_TYPE: ${{ steps.meta.outputs.dependency-type }}
          PREVIOUS_VERSION: ${{ steps.meta.outputs.previous-version }}
          NEW_VERSION: ${{ steps.meta.outputs.new-version }}
        shell: bash
        run: |
          set -euo pipefail
          # ruleset に required checks が無いと --auto が CI を待たずにマージしうるので、先に確認する
          contexts=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/develop" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | join(",")')
          for check in test e2e; do
            if [[ ",$contexts," != *",$check,"* ]]; then
              echo "::error::develop の ruleset に required status check '$check' が無いため auto-merge しない（docs/decisions.md [132]）"
              exit 1
            fi
          done
          scope=deps
          if [ "$DEPENDENCY_TYPE" = "direct:development" ]; then scope=deps-dev; fi
          # security-release-pr.yml は件名の GHSA ID を目印にリリース PR を作る
          subject="build($scope): $DEPENDENCY_NAMES を $NEW_VERSION に更新する（$GHSA_ID） (#$PR_NUMBER)"
          body_file="$RUNNER_TEMP/squash-body.md"
          printf '%s\n' \
            "Dependabot の security update（$GHSA_ID）。$DEPENDENCY_NAMES を $PREVIOUS_VERSION から $NEW_VERSION に更新する。" \
            "dependabot-auto-merge.yml が自動マージした（docs/decisions.md [132]）。" > "$body_file"
          # 評価した head 以外がマージされないよう head を固定する
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA" --subject "$subject" --body-file "$body_file"
          echo "auto-merge を有効化: $subject"

      - name: 自動マージしない理由をコメント
        if: "!cancelled() && steps.write-token.outcome == 'success' && (steps.decide.outputs.reason != '' || steps.release-age.outcome == 'failure')"
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.decide.outputs.reason }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$REASON" ]; then
            REASON="lockfile の確認で fail した（公開から 7 日未満・公開日時の取れない・registry 外の版がある、またはガードの実行に失敗）。workflow のログを確認すること"
          fi
          body_file="$RUNNER_TEMP/comment.md"
          printf '%s\n' \
            "この PR は develop へ自動マージしません（\`$HEAD_SHA\`）。" \
            "" \
            "- 理由: $REASON" \
            "- 判断して手動でマージしてください（docs/decisions.md [132]）" > "$body_file"
          gh pr comment "$PR_URL" --body-file "$body_file"
