name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 同一ブランチ/PRへの新しいプッシュが来たら実行中のジョブをキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: フォーマットチェックを実行
        run: npm run format:check

      # #339: astro check は CI で走っていなかったため hint debt が蓄積していた。
      # errors / warnings / hints すべて 0 を強制し、新規 hint 混入を即時 fail させる。
      # 内訳をログに残して debug 容易性も担保。
      - name: astro check（errors / warnings / hints すべて 0 を強制）
        run: |
          output=$(npx astro check 2>&1)
          echo "$output"
          errors=$(echo "$output" | grep -oE '^- [0-9]+ errors?' | tail -1 | grep -oE '[0-9]+' || true)
          warnings=$(echo "$output" | grep -oE '^- [0-9]+ warnings?' | tail -1 | grep -oE '[0-9]+' || true)
          hints=$(echo "$output" | grep -oE '^- [0-9]+ hints?' | tail -1 | grep -oE '[0-9]+' || true)
          errors=${errors:-0}
          warnings=${warnings:-0}
          hints=${hints:-0}
          echo "Parsed summary: errors=$errors / warnings=$warnings / hints=$hints"
          if [ "$errors" != "0" ] || [ "$warnings" != "0" ] || [ "$hints" != "0" ]; then
            echo "::error::astro check requires 0/0/0 but got errors=$errors / warnings=$warnings / hints=$hints"
            exit 1
          fi

      - name: 本番相当アセットを build（meta-csp.test.ts が dist/ を入力とするため必要 / #250）
        run: npm run build

      - name: テストとカバレッジ測定を実行
        run: npm test -- --coverage

      - name: カバレッジ値とカラーを算出
        id: coverage
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          COVERAGE=$(node -e "console.log(Math.round(require('./coverage/coverage-summary.json').total.statements.pct))")
          COLOR=$(COVERAGE=$COVERAGE node -e "const pct = +process.env.COVERAGE; console.log(pct >= 90 ? 'brightgreen' : pct >= 80 ? 'green' : pct >= 70 ? 'yellowgreen' : pct >= 60 ? 'yellow' : 'red')")
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"

      - name: カバレッジバッジ用 Gist を更新
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 69f5d57c79b9b687f7c2ef61dcda57e5
          filename: devtools-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.coverage }}%
          color: ${{ steps.coverage.outputs.color }}

  e2e:
    runs-on: ubuntu-latest
    # #291: Playwright 公式 image でブラウザバイナリ + OS deps を preinstalled 化し、
    # `npx playwright install --with-deps chromium` の 7 分超を撤廃。
    # tag は package.json の `@playwright/test` バージョンと一致させる
    # (Playwright アップデート時は `mcr.microsoft.com/playwright:vX.Y.Z-noble` も bump)。
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Playwright ブラウザは container image に preinstalled 済 (#291)。
      # PLAYWRIGHT_BROWSERS_PATH=/ms-playwright が image で設定済みのため install step 不要。

      - name: 本番相当アセットを build（E2E は preview 経由で配信するため必要）
        run: npm run build

      - name: E2E テストを実行
        run: npm run test:e2e

      - name: テストレポートをアップロード（失敗時）
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
