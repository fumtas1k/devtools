name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 同一ブランチ/PRへの新しいプッシュが来たら実行中のジョブをキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: フォーマットチェックを実行
        run: npm run format:check

      - name: 本番相当アセットを build（meta-csp.test.ts が dist/ を入力とするため必要 / #250）
        run: npm run build

      - name: テストとカバレッジ測定を実行
        run: npm test -- --coverage

      - name: カバレッジ値とカラーを算出
        id: coverage
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          COVERAGE=$(node -e "console.log(Math.round(require('./coverage/coverage-summary.json').total.statements.pct))")
          COLOR=$(COVERAGE=$COVERAGE node -e "const pct = +process.env.COVERAGE; console.log(pct >= 90 ? 'brightgreen' : pct >= 80 ? 'green' : pct >= 70 ? 'yellowgreen' : pct >= 60 ? 'yellow' : 'red')")
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "color=$COLOR" >> "$GITHUB_OUTPUT"

      - name: カバレッジバッジ用 Gist を更新
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 69f5d57c79b9b687f7c2ef61dcda57e5
          filename: devtools-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.coverage }}%
          color: ${{ steps.coverage.outputs.color }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright ブラウザをインストール
        run: npx playwright install --with-deps chromium

      - name: 本番相当アセットを build（E2E は preview 経由で配信するため必要）
        run: npm run build

      - name: E2E テストを実行
        run: npm run test:e2e

      - name: テストレポートをアップロード（失敗時）
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
