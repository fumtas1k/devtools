name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 同一ブランチ/PRへの新しいプッシュが来たら実行中のジョブをキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: テストとカバレッジ測定を実行
        run: npm test -- --coverage

      - name: カバレッジバッジを更新
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.statements.pct)")
          COLOR=$(node -e "const pct = $COVERAGE; console.log(pct >= 90 ? 'brightgreen' : pct >= 80 ? 'green' : pct >= 70 ? 'yellowgreen' : pct >= 60 ? 'yellow' : 'red')")
          sed -i "s/coverage-.*-green/coverage-$COVERAGE%25-$COLOR/g" README.md
          sed -i "s/coverage-.*-yellowgreen/coverage-$COVERAGE%25-$COLOR/g" README.md
          sed -i "s/coverage-.*-yellow/coverage-$COVERAGE%25-$COLOR/g" README.md
          sed -i "s/coverage-.*-red/coverage-$COVERAGE%25-$COLOR/g" README.md
          sed -i "s/coverage-.*-brightgreen/coverage-$COVERAGE%25-$COLOR/g" README.md

      - name: 変更をコミットしてプッシュ
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update coverage badge [skip ci]" && git push)

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright ブラウザをインストール
        run: npx playwright install --with-deps chromium

      - name: E2E テストを実行
        run: npm run test:e2e

      - name: テストレポートをアップロード（失敗時）
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
