name: Update Visual Regression Baseline

on:
  # #VRT: feature/vrt-setup ブランチから self-trigger するための一時 push trigger。
  # 初回 baseline 生成後、本 push trigger は別 commit で削除し workflow_dispatch のみに戻す。
  # （GitHub Actions 制約: workflow_dispatch は default branch からしか trigger できないため、
  # 初回ブートストラップにのみ push trigger を使う。PR #247 で確立した運用）
  push:
    branches:
      - feature/vrt-setup
    paths:
      - .github/workflows/update-visual-baseline.yml
      - tests/e2e/visual-regression.spec.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baseline:
    # default branch (develop / main) 上で誤って trigger された場合は no-op。
    # branch protection 違反を回避し、「baseline 更新は必ず PR ブランチで」を workflow レベルで強制。
    if: github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright ブラウザをインストール
        run: npx playwright install --with-deps chromium
      - name: 本番相当アセットを build
        run: npm run build
      - name: Visual regression baseline を再生成
        run: npx playwright test --project=visual-regression --workers=1 --update-snapshots
      - name: 変更があれば commit & push
        run: |
          if [ -n "$(git status --porcelain tests/e2e/visual-regression.spec.ts-snapshots/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/e2e/visual-regression.spec.ts-snapshots/
            git commit -m "test(vrt): visual regression baseline を CI Linux runner で再生成"
            git push
          else
            echo "baseline 差分なし、commit skip"
          fi
