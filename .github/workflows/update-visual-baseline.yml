name: Update Visual Regression Baseline

on:
  # #176 B 案 PR 1 で feature branch から self-trigger するため一時的に push を有効化。
  # 初回 CI Linux baseline 生成完了後、本 push trigger は別 commit で削除し
  # workflow_dispatch のみに戻す（GitHub Actions の制約: workflow_dispatch は default branch
  # からしか trigger できないため、初回ブートストラップにのみ push trigger を使う）。
  push:
    branches:
      - feature/issue-176-b1-foundation
    paths:
      - .github/workflows/update-visual-baseline.yml
      - tests/e2e/visual-regression.spec.ts
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright ブラウザをインストール
        run: npx playwright install --with-deps chromium
      - name: 本番相当アセットを build
        run: npm run build
      - name: Visual regression baseline を再生成
        run: npx playwright test tests/e2e/visual-regression.spec.ts --workers=1 --update-snapshots
      - name: 変更があれば commit & push
        run: |
          if [ -n "$(git status --porcelain tests/e2e/visual-regression.spec.ts-snapshots/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/e2e/visual-regression.spec.ts-snapshots/
            git commit -m "test(e2e): visual regression baseline を CI Linux runner で再生成"
            git push
          else
            echo "baseline 差分なし、commit skip"
          fi
