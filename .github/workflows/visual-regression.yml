name: Visual Regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 同一 PR への新しい push が来たら実行中の job をキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # gh-pages push 用
  pull-requests: write # PR comment 投稿用

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    # #291: Playwright 公式 image でブラウザバイナリ + OS deps を preinstalled 化し、
    # `npx playwright install --with-deps chromium` の 7 分超を撤廃。
    # tag は package.json の `@playwright/test` バージョンと一致させる
    # (Playwright アップデート時は `mcr.microsoft.com/playwright:vX.Y.Z-noble` も bump)。
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Playwright ブラウザは container image に preinstalled 済 (#291)。
      # PLAYWRIGHT_BROWSERS_PATH=/ms-playwright が image で設定済みのため install step 不要。

      - name: 本番相当アセットを build
        run: npm run build

      - name: VRT 実行
        id: vrt
        shell: bash
        # fail 時は step 自体を ❌ に。後続 step は if: !cancelled() で継続させる
        # （continue-on-error は使わない — UI 上 ✅ に化けて diff の発生箇所が見えなくなるため）。
        # pipefail で playwright の exit code を tee 越しでも保持。
        run: |
          set -o pipefail
          npm run test:vrt -- --workers=1 2>&1 | tee vrt-output.log

      - name: テストレポートを artifact upload（pass/fail 問わず）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report-pr-${{ github.event.pull_request.number }}
          path: playwright-report/
          retention-days: 14

      - name: スライダーレポートを生成
        if: ${{ !cancelled() && steps.vrt.outcome == 'failure' }}
        id: gen-slider
        shell: bash
        run: |
          node scripts/generate-vrt-slider.mjs
          if [ -f vrt-slider-report/index.html ]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: スライダーレポートを GitHub Pages へ deploy
        if: ${{ !cancelled() && steps.gen-slider.outputs.generated == 'true' && github.event.pull_request.number }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # --user 1001 環境でも /tmp は書き込み可能
          export GIT_CONFIG_GLOBAL=/tmp/.gitconfig
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory /tmp/gh-pages

          # gh-pages を local branch として worktree 化
          # （既存: fetch して local branch 作成、なければ孤立ブランチ作成）
          if git ls-remote --exit-code origin gh-pages 2>/dev/null; then
            git fetch origin gh-pages:gh-pages
            git worktree add /tmp/gh-pages gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/gh-pages
          fi

          # VRT レポートをコピー（cd 後も参照できるよう絶対パスを使用）
          WS="${GITHUB_WORKSPACE}"
          mkdir -p /tmp/gh-pages/vrt/pr-${PR_NUM}
          cp -r "${WS}/vrt-slider-report/." /tmp/gh-pages/vrt/pr-${PR_NUM}/

          cd /tmp/gh-pages
          git add .
          if git diff --staged --quiet; then
            echo "変更なし — スキップ"
            exit 0
          fi
          git commit -m "chore: VRT スライダーレポート更新 PR #${PR_NUM}"

          # push（複数 PR 並走による競合時は fetch → reset → reapply して最大 3 回リトライ）
          for attempt in 1 2 3; do
            if git push "${REPO_URL}" gh-pages; then
              break
            elif [ $attempt -lt 3 ]; then
              echo "push 競合 (attempt ${attempt}/3): 最新を取得してリトライ..."
              git fetch "${REPO_URL}" refs/heads/gh-pages:refs/remotes/tmp/gh-pages
              git reset --hard refs/remotes/tmp/gh-pages
              mkdir -p vrt/pr-${PR_NUM}
              cp -r "${WS}/vrt-slider-report/." vrt/pr-${PR_NUM}/
              git add .
              git diff --staged --quiet || git commit -m "chore: VRT スライダーレポート更新 PR #${PR_NUM}"
              sleep $((attempt * 3))
            else
              echo "push 失敗: ${attempt} 回試行しました" >&2
              exit 1
            fi
          done

      - name: 既存の VRT comment を検索（dedup 用）
        if: ${{ !cancelled() && github.event.pull_request.number }}
        id: find-vrt-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '## 🖼️ Visual Regression Test 結果'

      - name: PR comment 本文を組み立て（失敗 spec 名込み）
        if: ${{ !cancelled() && github.event.pull_request.number }}
        id: build-body
        shell: bash
        run: |
          {
            echo "body<<MARKDOWN_EOF"
            echo "## 🖼️ Visual Regression Test 結果"
            echo ""
            if [ "${{ steps.vrt.outcome }}" = "success" ]; then
              # vrt-output.log の playwright 集計行 "N passed" から件数を動的抽出。
              # PAGES × VIEWPORTS 数を hardcode していると新規ページ追加時に
              # 文言と実態が乖離するため (issue #355 の派生対応)。
              PASS_COUNT=$(grep -oE '[0-9]+ passed' vrt-output.log 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo "")
              if [ -n "$PASS_COUNT" ]; then
                echo "- **Status**: ✅ 全 ${PASS_COUNT} 件 pass"
              else
                echo "- **Status**: ✅ pass"
              fi
            else
              echo "- **Status**: ❌ 一部 fail"
            fi
            echo "- **Workflow run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- **Artifact (diff 画像 / playwright-report)**: 上記 workflow run の \`Artifacts\` セクションから download"
            if [ "${{ steps.gen-slider.outputs.generated }}" = "true" ]; then
              PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/vrt/pr-${{ github.event.pull_request.number }}/"
              echo "- **🖼️ スライダー比較レポート**: [差分をブラウザで確認]($PAGES_URL)（deploy 完了まで 1〜2 分）"
            fi

            if [ "${{ steps.vrt.outcome }}" = "failure" ] && [ -f vrt-output.log ]; then
              echo ""
              echo "### 失敗した spec"
              echo ""
              # 各 ✘ 行の最後の › 区切り（spec 名）と直前の区切り（viewport 記述）を抽出。
              # retry 行は除外して unique 化、最大 30 行に丸める。
              # pipeline 全体を `( ... ) || true` で包む: 最初の grep だけでなく後段の `grep -v`
              # も入力 0 行のとき exit 1 を返すため (grep 仕様)、subshell 全体で救わないと
              # `set -e -o pipefail` で heredoc が中断する。
              ( grep -E '^[[:space:]]+✘' vrt-output.log \
                | grep -v '(retry' \
                | awk -F'›' '{
                    n = NF
                    spec = $n
                    sub(/^[ \t]+/, "", spec)
                    sub(/[ \t]*\([0-9.]+m?s\)[ \t]*$/, "", spec)
                    vp = $(n - 1)
                    sub(/^[ \t]+/, "", vp)
                    sub(/[ \t]+$/, "", vp)
                    print "- [" vp "] " spec
                  }' \
                | sort -u \
                | head -30 ) || true
            fi

            echo ""
            echo "> diff が **意図的な visual 変更**の場合: \`Update Visual Regression Baseline\` workflow を本 PR ブランチで \`workflow_dispatch\` trigger して baseline を更新。"
            echo "> diff が **意図しない regression** の場合: 該当変更を fix。"
            echo "> 本 check は **required ではない**ため fail のままでも merge は可能（reviewer 判断）。"
            echo "MARKDOWN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 結果を PR comment で報告
        if: ${{ !cancelled() && github.event.pull_request.number }}
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-vrt-comment.outputs.comment-id }}
          edit-mode: replace
          body: ${{ steps.build-body.outputs.body }}
