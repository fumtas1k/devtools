name: CodeQL

# 自前コード（.ts / .tsx / .js 等）と GitHub Actions workflow の脆弱性を静的解析する。
# CodeQL の JS/TS extractor は .astro を抽出しないため、.astro の frontmatter・<script>・
# set:html は解析対象外（docs/decisions.md [131]）。
# 結果は Security タブの Code scanning alerts に出る。
# 注意: リポジトリ設定で Code scanning の「Default setup」を有効にすると本 workflow の
# アップロードが拒否される。advanced setup（本ファイル）で一元管理する。

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '41 20 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
