name: Security Audit

# 依存パッケージの既知脆弱性（GitHub Advisory）を npm audit で検知する。
# docs/decisions.md [009] で「audit は CI の別ステップで管理する」とした判断の実装。
#
# required status check には登録しない: 複数の advisory が同時に出ると、
# それぞれを 1 件ずつ直す Dependabot PR がすべて audit で fail し、自動マージが
# 相互にデッドロックするため。修正の主経路は Dependabot security updates、
# 本 workflow は検知・可視化（schedule 失敗時の通知）を担う。

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Dependabot alerts を見逃しても、日次で develop の状態を確認する
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # gate と陽性対照で同じ閾値を使う（drift は tests/meta/security-audit-workflow.test.ts が検知）
  AUDIT_LEVEL: high

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      # npm audit は lockfile だけで判定できるため npm ci は不要
      - name: npm audit（high 以上で fail）
        run: npm audit --audit-level="$AUDIT_LEVEL"

  # 陽性対照: 既知の high 脆弱性を含む lockfile を audit し、gate が fail することを確認する。
  # fixture をリポジトリにコミットすると Dependabot が alert / 修正 PR を出すため、実行時に生成する。
  npm-audit-positive-control:
    runs-on: ubuntu-latest
    steps:
      # gate と同じ Node（= 同じ npm）・同じ .npmrc で audit するため、この 2 ファイルだけ取得する
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .node-version
            .npmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: 陽性対照 — 既知の脆弱版 lodash を gate が検知することを確認
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/npm-audit-positive-control"
          mkdir -p "$dir"
          # repo の .npmrc に audit の範囲を狭める設定（omit=dev 等）が入ったら陽性対照も fail させる
          cp "$GITHUB_WORKSPACE/.npmrc" "$dir/.npmrc"
          cd "$dir"
          # lodash 4.17.20: GHSA-35jh-r3h4-6jhm（Command Injection, high）。
          # dev 依存を audit から外す drift も捕まえるため devDependencies に置く
          printf '{"name":"npm-audit-positive-control","version":"1.0.0","private":true,"devDependencies":{"lodash":"4.17.20"}}\n' > package.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

          set +e
          npm audit --audit-level="$AUDIT_LEVEL" > audit.txt 2>&1
          code=$?
          set -e
          cat audit.txt

          if [ "$code" = "0" ]; then
            echo "::error::POSITIVE CONTROL FAILED — 既知の high 脆弱性があるのに npm audit が exit 0 を返した。gate が検知できていない。"
            exit 1
          fi
          # registry 障害等で exit 非 0 になっただけのケースを陽性と誤認しない
          grep -q 'GHSA-35jh-r3h4-6jhm' audit.txt || {
            echo "::error::POSITIVE CONTROL FAILED — npm audit は exit=$code だが lodash の advisory が報告されていない（audit endpoint 障害の可能性）。"
            exit 1
          }
          echo "OK: gate は既知の high 脆弱性を検知した（exit=$code）"
